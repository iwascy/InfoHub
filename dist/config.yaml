server:
  port: ${INFOHUB_PORT}
  auth_token: "${INFOHUB_AUTH_TOKEN}"
  dashboard_token: "${INFOHUB_DASHBOARD_TOKEN}"
  # Token presented by infohub-agent on POST /api/v1/ingest/local-usage.
  # Falls back to auth_token when empty.
  ingest_token: "${INFOHUB_INGEST_TOKEN}"
  mock_enabled: ${INFOHUB_MOCK_ENABLED}
  read_timeout_seconds: 10
  write_timeout_seconds: 10
  shutdown_timeout_seconds: 10

dashboard:
  template: "trio" # trio | codex | deepseek-codex
  accounts:
    - "cycyzg@gmail.com"
    - "qqcyan@gmail.com"
  sources:
    sub2api: "sub2api"

collectors:
  claude_relay:
    enabled: ${CLAUDE_RELAY_ENABLED}
    cron: "*/10 * * * *"
    timeout_seconds: 15
    service:
      base_url: "${CLAUDE_RELAY_BASE_URL}"
      headers: {}
      endpoints:
        accounts: "/admin/claude-accounts"
        usage: "/admin/claude-accounts/usage"
    auth:
      type: "login_json"
      header_name: "Authorization"
      token_prefix: "Bearer"
      login_endpoint: "/web/auth/login"
      method: "POST"
      token_path: "token"
      headers: {}
      credentials:
        username: "${CLAUDE_RELAY_USERNAME}"
        password: "${CLAUDE_RELAY_PASSWORD}"

  sub2api:
    enabled: ${SUB2API_ENABLED}
    cron: "*/10 * * * *"
    timeout_seconds: 15
    service:
      base_url: "${SUB2API_BASE_URL}"
      headers: {}
      endpoints:
        accounts: "/api/v1/admin/accounts"
        today_stats: "/api/v1/admin/accounts/today-stats/batch"
        search_users: "/api/v1/admin/usage/search-users"
        usage_stats: "/api/v1/admin/usage/stats"
        user_platform_quotas: "/api/v1/admin/users/{id}/platform-quotas"
        user_detail: "/api/v1/admin/users/{id}"
    targets:
      - type: "user"
        name: "admin@sub2api.cccy.fun"
        email: "admin@sub2api.cccy.fun"
        include_usage: true
      - type: "account"
        name: "Pro 20x"
        match: "Pro 20x"
        include_quota: true
      - type: "account"
        email: "cycyzg@gmail.com"
        include_quota: true
      - type: "account"
        email: "qqcyan@gmail.com"
        include_quota: true
    auth:
      type: "login_json"
      header_name: "Authorization"
      token_prefix: "Bearer"
      login_endpoint: "${SUB2API_BASE_URL}/api/v1/auth/login"
      method: "POST"
      token_path: "data.access_token"
      headers: {}
      credentials:
        email: "${SUB2API_ADMIN_EMAIL}"
        password: "${SUB2API_ADMIN_PASSWORD}"

  feishu:
    enabled: false
    cron: "*/30 * * * *"
    base_url: "https://open.feishu.cn"
    endpoint: ""
    app_id: ""
    app_secret: ""
    project_key: ""
    timeout_seconds: 15
    headers: {}

  claude_local:
    enabled: true
    cron: "*/5 * * * *"
    timeout_seconds: 15
    paths:
      - "${HOME}/.config/claude/projects"
      - "${HOME}/.claude/projects"
    # builtin: scan local JSONL files | ccusage: shell out to ccusage CLI
    # remote: aggregate records pushed by infohub-agent (requires sqlite store;
    #         set online.enabled false and run the agent on dev machines)
    mode: "builtin"
    # remote_quota_stale_seconds: 1800  # max age of agent-reported quota in remote mode
    online:
      enabled: true  # Read-only OAuth usage query; does not modify Claude Code config.
      # auth_path: "${HOME}/.claude/.credentials.json"
      # base_url: "https://api.anthropic.com"
      # timeout_seconds: 8
      # stale_after_seconds: 60
    quota:
      plan: "local"
      five_hour_msg_cap: 0
      weekly_msg_cap: 0
      monthly_msg_cap: 0

  codex_local:
    enabled: true
    cron: "*/5 * * * *"
    timeout_seconds: 15
    paths:
      - "${HOME}/.codex/sessions"
    # builtin: scan local JSONL files | remote: aggregate agent-pushed records
    mode: "builtin"
    # remote_quota_stale_seconds: 1800
    online:
      enabled: true  # Uses ~/.codex/auth.json as an online 5H / Week quota fallback.
      # auth_path: "${HOME}/.codex/auth.json"
      # base_url: "https://chatgpt.com"
      # timeout_seconds: 8
      # stale_after_seconds: 60
    quota:
      plan: "local"
      five_hour_msg_cap: 0
      weekly_msg_cap: 0

  # Claude Pro quota + usage via CLIProxyAPI (CPA) management API.
  # The CPA usage queue is drained destructively: enable this on ONE infohub
  # instance only, and keep CPA's redis-usage-queue-retention-seconds above
  # the drain interval (raising it to 3600 tolerates infohub restarts).
  cpa:
    enabled: ${CPA_ENABLED}
    cron: "@every 30s"
    timeout_seconds: 15
    base_url: "${CPA_BASE_URL}"
    management_key: "${CPA_MANAGEMENT_KEY}"
    provider: "claude"
    display_name: "Claude Pro"
    # account: ""               # pin one CPA credential by email
    quota_interval_seconds: 120 # upstream /api/oauth/usage lookups

  # Antigravity quota groups pushed by infohub-agent (antigravity.enabled).
  antigravity:
    enabled: ${ANTIGRAVITY_ENABLED}
    cron: "*/5 * * * *"
    stale_seconds: 1800

store:
  type: "${INFOHUB_STORE_TYPE}"
  sqlite_path: "${INFOHUB_SQLITE_PATH}"

log:
  level: "${INFOHUB_LOG_LEVEL}"
