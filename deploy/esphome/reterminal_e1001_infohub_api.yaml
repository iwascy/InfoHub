# Stage 2 profile:
# first finish USB bring-up with a known-good Stage 1 profile,
# then switch to this API-driven panel.
# 2026-04-23 当前这台 E1001 已完成 partial refresh 验证。
# 正式业务面板切换到 7.50inV2p，并保留 2ms reset 时序。

substitutions:
  device_name: reterminal-e1001-infohub
  friendly_name: reTerminal E1001 InfoHub
  plugged_poll_interval: 2min
  battery_wake_interval_minutes: "30"
  low_battery_wake_interval_minutes: "120"
  battery_awake_timeout: 60s
  battery_sensor_update_interval: 2min
  power_profile_update_interval: 5min
  time_zone: Asia/Shanghai
  battery_quiet_start_hour: "22"
  battery_quiet_end_hour: "10"
  plugged_voltage_threshold: "4.15"
  battery_voltage_threshold: "4.05"
  low_battery_level_threshold: "20"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
        - lambda: |-
            esp_sleep_wakeup_cause_t wakeup_cause = esp_sleep_get_wakeup_cause();
            if (wakeup_cause == ESP_SLEEP_WAKEUP_EXT0 ||
                wakeup_cause == ESP_SLEEP_WAKEUP_EXT1 ||
                wakeup_cause == ESP_SLEEP_WAKEUP_GPIO) {
              id(manual_wake_refresh_requested) = true;
              id(force_full_refresh_requested) = true;
              ESP_LOGI("power_profile", "manual wake detected, forcing one refresh");
            } else if (wakeup_cause != ESP_SLEEP_WAKEUP_TIMER) {
              // A cold boot, OTA reboot, or reset may be running a new layout.
              id(force_full_refresh_requested) = true;
            }
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
        - output.turn_off: bsp_battery_enable
        - script.execute: battery_awake_watchdog

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret esphome_api_encryption_key

ota:
  - platform: esphome
    password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH
  # 静态 IP 可以明显缩短唤醒后联网时间。填好 secrets 后取消注释。
  # manual_ip:
  #   static_ip: !secret wifi_static_ip
  #   gateway: !secret wifi_gateway
  #   subnet: !secret wifi_subnet
  on_connect:
    then:
      - script.execute: run_power_aware_refresh
  ap:
    ssid: "InfoHub Fallback"
    password: !secret wifi_fallback_password
    ap_timeout: 0s

captive_portal:

json:

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

http_request:
  verify_ssl: false
  timeout: 10s
  watchdog_timeout: 12s
  useragent: ${device_name}

