globals:
  - id: battery_sample_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: low_battery_active
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: low_battery_display_refresh_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: external_power_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_payload_body
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_error_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_display_refresh
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: force_full_refresh_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_wake_refresh_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: payload_fingerprint
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: payload_fingerprint_ready
    type: bool
    restore_value: yes
    initial_value: 'false'

sensor:
  - platform: adc
    pin: GPIO1
    name: "${friendly_name} Battery Voltage"
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
    on_value:
      then:
        - lambda: |-
            const float plugged_threshold = ${plugged_voltage_threshold};
            const float battery_threshold = ${battery_voltage_threshold};
            bool had_sample = id(battery_sample_ready);
            bool previous_mode = id(external_power_connected);
            bool next_mode = previous_mode;

            if (!had_sample) {
              next_mode = x >= plugged_threshold;
              id(battery_sample_ready) = true;
            } else if (x >= plugged_threshold) {
              next_mode = true;
            } else if (x <= battery_threshold) {
              next_mode = false;
            }

            id(external_power_connected) = next_mode;

            if (had_sample && next_mode != previous_mode) {
              ESP_LOGI(
                "power_profile",
                "power profile changed to %s at %.2fV",
                next_mode ? "plugged" : "battery",
                x
              );
              id(run_power_aware_refresh).execute();
            }

  - platform: template
    name: "${friendly_name} Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      return id(battery_voltage).state;
    update_interval: never
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      then:
        - lambda: |-
            const float low_battery_threshold = ${low_battery_level_threshold};
            bool next_low_battery = x <= low_battery_threshold;
            bool changed = id(low_battery_active) != next_low_battery;

            id(low_battery_active) = next_low_battery;
            id(low_battery_display_refresh_pending) =
              changed && (!id(last_payload_body).empty() || !id(last_error_text).empty());
            if (changed && id(last_payload_body).empty()) {
              id(force_full_refresh_requested) = true;
            }
        - if:
            condition:
              lambda: return id(low_battery_display_refresh_pending);
            then:
              - component.update: epaper_display
              - lambda: id(low_battery_display_refresh_pending) = false;

text_sensor:
  - platform: template
    name: "${friendly_name} Power Profile"
    icon: "mdi:power-plug-battery"
    update_interval: ${power_profile_update_interval}
    lambda: |-
      if (!id(battery_sample_ready)) {
        return {"检测中"};
      }

      if (id(external_power_connected)) {
        return {"插电高实时"};
      }

      auto now = id(sntp_clock).now();
      if (now.is_valid() &&
          (now.hour >= ${battery_quiet_start_hour} || now.hour < ${battery_quiet_end_hour})) {
        return {"电池夜间静默"};
      }

      return {"电池省电"};

time:
  - platform: sntp
    id: sntp_clock
    timezone: ${time_zone}
    on_time:
      - hours: ${battery_quiet_start_hour}
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                lambda: return id(battery_sample_ready) && !id(external_power_connected);
              then:
                - logger.log: "battery quiet hours started, entering deep sleep"
                - deep_sleep.enter:
                    id: quiet_hours_sleep
                    until: "10:00:00"
                    time_id: sntp_clock
      - hours: ${battery_quiet_end_hour}
        minutes: 0
        seconds: 0
        then:
          - script.execute: run_power_aware_refresh

deep_sleep:
  id: quiet_hours_sleep
  wakeup_pin:
    number: GPIO4
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

script:
  - id: sample_battery
    mode: restart
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      - output.turn_off: bsp_battery_enable

  - id: enter_battery_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(battery_sample_ready) && !id(external_power_connected);
          then:
            - output.turn_off: bsp_battery_enable
            - lambda: id(manual_wake_refresh_requested) = false;
            - if:
                condition:
                  lambda: |-
                    auto now = id(sntp_clock).now();
                    return now.is_valid() &&
                      (now.hour >= ${battery_quiet_start_hour} ||
                       now.hour < ${battery_quiet_end_hour});
                then:
                  - logger.log: "battery quiet hours active, sleeping until 10:00"
                  - deep_sleep.enter:
                      id: quiet_hours_sleep
                      until: "10:00:00"
                      time_id: sntp_clock
                else:
                  - if:
                      condition:
                        lambda: return id(low_battery_active);
                      then:
                        - logger.log: "low battery cycle finished, entering extended deep sleep"
                        - lambda: |-
                            id(quiet_hours_sleep).set_sleep_duration(
                              ${low_battery_wake_interval_minutes}UL * 60UL * 1000UL
                            );
                        - deep_sleep.enter: quiet_hours_sleep
                      else:
                        - logger.log: "battery cycle finished, entering deep sleep"
                        - lambda: |-
                            id(quiet_hours_sleep).set_sleep_duration(
                              ${battery_wake_interval_minutes}UL * 60UL * 1000UL
                            );
                        - deep_sleep.enter: quiet_hours_sleep

  - id: battery_awake_watchdog
    mode: restart
    then:
      - delay: ${battery_awake_timeout}
      - if:
          condition:
            lambda: return id(battery_sample_ready) && !id(external_power_connected);
          then:
            - logger.log: "battery awake timeout reached, forcing deep sleep"
            - script.execute: enter_battery_sleep

  - id: run_power_aware_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(battery_sample_ready)) {
                return false;
              }

              if (id(manual_wake_refresh_requested)) {
                return true;
              }

              if (id(external_power_connected)) {
                return true;
              }

              auto now = id(sntp_clock).now();
              if (!now.is_valid()) {
                // A cold boot may connect before SNTP. Fetch once; the sleep
                // decision will use wall-clock time if it becomes available.
                return true;
              }

              return now.hour < ${battery_quiet_end_hour} ||
                now.hour >= ${battery_quiet_start_hour}
                ? false
                : true;
          then:
            - script.execute: fetch_dashboard_payload
          else:
            - if:
                condition:
                  lambda: |-
                    if (!id(battery_sample_ready) || id(external_power_connected)) {
                      return false;
                    }

                    auto now = id(sntp_clock).now();
                    return now.is_valid() &&
                      (now.hour >= ${battery_quiet_start_hour} ||
                       now.hour < ${battery_quiet_end_hour});
                then:
                  - script.execute: enter_battery_sleep

  - id: fetch_dashboard_payload
    mode: single
    then:
      - http_request.get:
          url: !secret infohub_eink_device_url
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            then:
              - lambda: |-
                  bool should_refresh = false;
                  if (response->status_code != 200) {
                    std::string next_error = "HTTP " + std::to_string(response->status_code);
                    bool has_cached_payload = !id(last_payload_body).empty();
                    if (id(last_error_text) != next_error) {
                      id(last_error_text) = next_error;
                      // Keep the previous E-Ink frame when the device reboots
                      // but the first refetch still has not succeeded yet.
                      should_refresh = has_cached_payload || id(manual_wake_refresh_requested);
                    } else if (id(manual_wake_refresh_requested)) {
                      should_refresh = true;
                    }
                    id(pending_display_refresh) = should_refresh;
                    return;
                  }

                  uint32_t next_payload_fingerprint = 2166136261U;
                  auto extend_fingerprint = [&](const char *data, size_t length) {
                    for (size_t index = 0; index < length; index++) {
                      next_payload_fingerprint ^= static_cast<uint8_t>(data[index]);
                      next_payload_fingerprint *= 16777619U;
                    }
                  };

                  bool parsed = json::parse_json(body, [&](JsonObject root) -> bool {
                    // Hash only the active template's visible values; timestamps alone
                    // do not refresh the panel. Template changes redraw immediately.
                    std::string layout = root["template"] | "codex";
                    std::vector<const char *> semantic_keys = {
                      "template", "refresh_seconds", "codex", "codex_week",
                      "daily_range", "week_range", "codex_accounts"
                    };
                    if (layout == "deepseek-codex") {
                      semantic_keys = {"template", "refresh_seconds", "deepseek",
                        "deepseek_quota", "codex", "total", "codex_rows", "alerts", "reset_hints"};
                    }
                    if (layout == "trio") {
                      semantic_keys = {"template", "refresh_seconds", "platforms"};
                    }
                    for (const char *key : semantic_keys) {
                      std::string serialized_value;
                      serializeJson(root[key], serialized_value);
                      extend_fingerprint(key, strlen(key));
                      extend_fingerprint(serialized_value.data(), serialized_value.size());
                    }
                    const char battery_state = id(low_battery_active) ? '1' : '0';
                    extend_fingerprint(&battery_state, 1);
                    return true;
                  });

                  if (!parsed) {
                    std::string next_error = "parse error";
                    bool has_cached_payload = !id(last_payload_body).empty();
                    if (id(last_error_text) != next_error) {
                      id(last_error_text) = next_error;
                      should_refresh = has_cached_payload || id(manual_wake_refresh_requested);
                    } else if (id(manual_wake_refresh_requested)) {
                      should_refresh = true;
                    }
                    id(pending_display_refresh) = should_refresh;
                    return;
                  }

                  bool semantic_changed =
                    !id(payload_fingerprint_ready) ||
                    id(payload_fingerprint) != next_payload_fingerprint;
                  id(last_payload_body) = body;
                  if (semantic_changed || id(force_full_refresh_requested) || id(manual_wake_refresh_requested)) {
                    id(payload_fingerprint) = next_payload_fingerprint;
                    id(payload_fingerprint_ready) = true;
                    should_refresh = true;
                  }

                  if (!id(last_error_text).empty()) {
                    id(last_error_text).clear();
                    should_refresh = true;
                  }

                  id(force_full_refresh_requested) = false;
                  id(pending_display_refresh) = should_refresh;
              - if:
                  condition:
                    lambda: return id(pending_display_refresh);
                  then:
                    - component.update: epaper_display
                    - lambda: id(pending_display_refresh) = false;
          on_error:
            then:
              - lambda: |-
                  std::string next_error = "network error";
                  bool has_cached_payload = !id(last_payload_body).empty();
                  bool should_refresh =
                    id(manual_wake_refresh_requested) ||
                    (has_cached_payload && id(last_error_text) != next_error);
                  id(last_error_text) = next_error;
                  id(pending_display_refresh) = should_refresh;
              - if:
                  condition:
                    lambda: return id(pending_display_refresh);
                  then:
                    - component.update: epaper_display
                    - lambda: id(pending_display_refresh) = false;
      - lambda: id(manual_wake_refresh_requested) = false;
      - script.execute: enter_battery_sleep

interval:
  - interval: ${plugged_poll_interval}
    then:
      - if:
          condition:
            lambda: return id(battery_sample_ready) && id(external_power_connected);
          then:
            - script.execute: run_power_aware_refresh

  - interval: ${battery_sensor_update_interval}
    then:
      - if:
          condition:
            lambda: return id(battery_sample_ready) && id(external_power_connected);
          then:
            - script.execute: sample_battery

button:
  - platform: template
    name: "${friendly_name} Force Sync"
    on_press:
      - lambda: id(force_full_refresh_requested) = true;
      - script.execute: fetch_dashboard_payload

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Refresh Button"
    on_press:
      then:
        - lambda: id(force_full_refresh_requested) = true;
        - script.execute: fetch_dashboard_payload

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    name: "${friendly_name} Wake Button"
    on_press:
      then:
        - lambda: id(force_full_refresh_requested) = true;
        - script.execute: fetch_dashboard_payload

display:
  - platform: waveshare_epaper
    id: epaper_display
    # 当前设备已验证支持 partial refresh，正式面板改走 7.50inV2p。
    # 保留 2ms reset 时序，避免回退到早期白屏初始化问题。
    model: 7.50inV2p
    full_update_every: 15
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    reset_duration: 2ms
    update_interval: never
    lambda: |-
      bool legacy_template = false;
      bool trio_template = false;
      if (!id(last_payload_body).empty()) {
        json::parse_json(id(last_payload_body), [&](JsonObject root) -> bool {
          std::string layout = root["template"] | "codex";
          legacy_template = layout == "deepseek-codex";
          trio_template = layout == "trio";
          return true;
        });
      }
      if (legacy_template) {
        it.fill(COLOR_OFF);

        auto trim_text = [&](const std::string &value, size_t max_chars) -> std::string {
          if (max_chars <= 2) {
            return value;
          }

          size_t idx = 0;
          size_t count = 0;
          while (idx < value.size()) {
            unsigned char ch = static_cast<unsigned char>(value[idx]);
            size_t step = 1;
            if ((ch & 0x80) == 0x00) {
              step = 1;
            } else if ((ch & 0xE0) == 0xC0) {
              step = 2;
            } else if ((ch & 0xF0) == 0xE0) {
              step = 3;
            } else if ((ch & 0xF8) == 0xF0) {
              step = 4;
            }

            if (idx + step > value.size()) {
              break;
            }
            if (count == max_chars) {
              return value.substr(0, idx) + "..";
            }
            idx += step;
            count++;
          }
          return value;
        };

        auto parse_number_text = [&](const std::string &value) -> long long {
          long long result = 0;
          for (char ch : value) {
            if (ch >= '0' && ch <= '9') {
              result = result * 10 + (ch - '0');
            }
          }
          return result;
        };

        auto format_percent = [&](int percent) -> std::string {
          if (percent < 0) {
            return "--";
          }
          return std::to_string(percent) + "%";
        };

        auto clamp_percent = [&](int percent) -> int {
          int safe_percent = percent;
          if (safe_percent < 0) {
            safe_percent = 0;
          }
          if (safe_percent > 100) {
            safe_percent = 100;
          }
          return safe_percent;
        };

        struct Rect {
          int x;
          int y;
          int w;
          int h;
        };

        auto right_of = [&](const Rect &rect) -> int {
          return rect.x + rect.w;
        };

        auto bottom_of = [&](const Rect &rect) -> int {
          return rect.y + rect.h;
        };

        auto measure_text = [&](auto *font, const std::string &text, TextAlign align, int &width, int &height) {
          int x1 = 0;
          int y1 = 0;
          it.get_text_bounds(0, 0, text.c_str(), font, align, &x1, &y1, &width, &height);
        };

        auto utf8_length = [&](const std::string &value) -> size_t {
          size_t idx = 0;
          size_t count = 0;
          while (idx < value.size()) {
            unsigned char ch = static_cast<unsigned char>(value[idx]);
            size_t step = 1;
            if ((ch & 0x80) == 0x00) {
              step = 1;
            } else if ((ch & 0xE0) == 0xC0) {
              step = 2;
            } else if ((ch & 0xF0) == 0xE0) {
              step = 3;
            } else if ((ch & 0xF8) == 0xF0) {
              step = 4;
            }

            if (idx + step > value.size()) {
              break;
            }
            idx += step;
            count++;
          }
          return count;
        };

        auto fit_text_width = [&](auto *font, const std::string &value, int max_width) -> std::string {
          if (value.empty()) {
            return value;
          }

          int width = 0;
          int height = 0;
          measure_text(font, value, TextAlign::TOP_LEFT, width, height);
          if (width <= max_width) {
            return value;
          }

          size_t chars = utf8_length(value);
          while (chars > 2) {
            std::string candidate = trim_text(value, chars - 1);
            measure_text(font, candidate, TextAlign::TOP_LEFT, width, height);
            if (width <= max_width) {
              return candidate;
            }
            chars--;
          }

          return trim_text(value, 2);
        };

        auto badge_width = [&](auto *font, const std::string &text, int min_width, int max_width, int padding) -> int {
          int text_width = 0;
          int text_height = 0;
          measure_text(font, text, TextAlign::TOP_LEFT, text_width, text_height);
          int width = text_width + padding * 2;
          if (width < min_width) {
            width = min_width;
          }
          if (width > max_width) {
            width = max_width;
          }
          return width;
        };

        auto draw_filled_round_rect = [&](const Rect &box, int radius, Color color) {
          if (box.w <= 0 || box.h <= 0) {
            return;
          }

          int r = radius;
          if (r < 0) {
            r = 0;
          }
          if (r * 2 > box.w) {
            r = box.w / 2;
          }
          if (r * 2 > box.h) {
            r = box.h / 2;
          }

          if (r <= 0) {
            it.filled_rectangle(box.x, box.y, box.w, box.h, color);
            return;
          }

          int center_w = box.w - r * 2;
          int center_h = box.h - r * 2;
          if (center_w > 0) {
            it.filled_rectangle(box.x + r, box.y, center_w, box.h, color);
          }
          if (center_h > 0) {
            it.filled_rectangle(box.x, box.y + r, box.w, center_h, color);
          }

          it.filled_circle(box.x + r, box.y + r, r, color);
          it.filled_circle(box.x + box.w - r - 1, box.y + r, r, color);
          it.filled_circle(box.x + r, box.y + box.h - r - 1, r, color);
          it.filled_circle(box.x + box.w - r - 1, box.y + box.h - r - 1, r, color);
        };

        auto draw_outline_round_rect = [&](const Rect &box, int radius) {
          if (box.w <= 0 || box.h <= 0) {
            return;
          }

          draw_filled_round_rect(box, radius, COLOR_ON);
          if (box.w <= 2 || box.h <= 2) {
            return;
          }

          Rect inner{box.x + 1, box.y + 1, box.w - 2, box.h - 2};
          int inner_radius = radius > 0 ? radius - 1 : 0;
          draw_filled_round_rect(inner, inner_radius, COLOR_OFF);
        };

        auto draw_badge = [&](const Rect &box, const std::string &text, bool filled) {
          std::string fitted = fit_text_width(id(font_badge), text, box.w - 10);
          int radius = box.h / 2;
          if (filled) {
            draw_filled_round_rect(box, radius, COLOR_ON);
            it.printf(
              box.x + box.w / 2,
              box.y + box.h / 2,
              id(font_badge),
              COLOR_OFF,
              COLOR_ON,
              TextAlign::CENTER,
              "%s",
              fitted.c_str()
            );
            return;
          }

          draw_outline_round_rect(box, radius);
          it.printf(box.x + box.w / 2, box.y + box.h / 2, id(font_badge), TextAlign::CENTER, "%s", fitted.c_str());
        };

        auto draw_progress = [&](const Rect &track, int percent, bool full_when_unknown) {
          draw_outline_round_rect(track, track.h / 2);

          int safe_percent = percent < 0 ? (full_when_unknown ? 100 : 0) : clamp_percent(percent);
          if (safe_percent <= 0) {
            return;
          }

          int inner_w = track.w - 2;
          int inner_h = track.h - 2;
          if (inner_w <= 0 || inner_h <= 0) {
            return;
          }

          int fill_w = (inner_w * safe_percent) / 100;
          int min_fill = inner_h;
          if (fill_w < min_fill) {
            fill_w = min_fill;
          }
          if (fill_w > inner_w) {
            fill_w = inner_w;
          }

          Rect fill{track.x + 1, track.y + 1, fill_w, inner_h};
          draw_filled_round_rect(fill, fill.h / 2, COLOR_ON);
        };

