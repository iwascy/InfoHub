; Supervisor program config for infohub-agent.
;
; Install example:
;   sudo cp bin/infohub-agent /usr/local/bin/
;   sudo mkdir -p /etc/infohub-agent /var/log/infohub-agent /var/lib/infohub-agent
;   sudo cp deploy/agent/config.example.yaml /etc/infohub-agent/config.yaml
;   sudo chown -R cyan:cyan /var/log/infohub-agent /var/lib/infohub-agent
;   sudo cp deploy/agent/supervisor/infohub-agent.conf /etc/supervisor/conf.d/infohub-agent.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status infohub-agent
;
; Homebrew supervisor usually includes /opt/homebrew/etc/supervisor.d/*.ini:
;   cp deploy/agent/supervisor/infohub-agent.conf /opt/homebrew/etc/supervisor.d/infohub-agent.ini
;   supervisorctl reread
;   supervisorctl update
;
; Edit user, HOME, chown target, and config path for the machine that owns the Claude/Codex
; data directories. Do not use -once here; the agent stays alive and pushes
; every interval_seconds from config.yaml.

[program:infohub-agent]
command=/usr/local/bin/infohub-agent -config /etc/infohub-agent/config.yaml
directory=/
user=cyan
environment=HOME="/Users/cyan",XDG_STATE_HOME="/var/lib/infohub-agent"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/infohub-agent/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/infohub-agent/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
